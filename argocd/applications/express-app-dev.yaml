appVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https:github.com/gcp-k8s-gitops-automation
    targetRevision: main
    path: manifests/argocd/applications/express-app-dev
  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true